<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
<style>
*,::before,::after{box-sizing:border-box}
body{margin:0;background:#08080A;color:#F4F4F5;font-family:Inter,system-ui,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{text-decoration:none;color:inherit}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:flex;min-height:100vh}
.side{width:256px;flex-shrink:0;height:100vh;position:sticky;top:0;background:#0E0E10;border-right:1px solid #26262A;padding:22px 14px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:0 4px;margin-bottom:26px}
.mk{width:34px;height:34px;border-radius:10px;background:#fff;color:#08080A;display:grid;place-items:center;font-size:15px;font-weight:700;letter-spacing:-.6px}
.bn{font-size:14.5px;font-weight:600;letter-spacing:-.2px}.bl{font-size:8px;letter-spacing:1.6px;color:#8A8A93;margin-top:2px}
nav{display:flex;flex-direction:column;gap:4px}
.nav{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:500;color:#8A8A93;transition:background .15s,color .15s}
.nav:hover{background:#151517;color:#F4F4F5}
.nav.on{background:#6C4BE8;color:#fff}
.nav span{flex:1}
.bdg{background:#2A2A2E;color:#D4D4D8;font-size:9px;font-weight:500;padding:2px 6px;border-radius:999px}
.sp{flex:1}
.sf{display:flex;flex-direction:column;gap:10px}
.vc{height:36px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #26262A;border-radius:10px;font-size:11.5px;color:#C8C8CE;transition:.15s}
.vc .ic{width:14px;height:14px;color:#8A8A93}
.vc:hover{background:#151517;border-color:#6C4BE8;color:#fff}
.uc{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#151517;border-radius:12px;transition:.15s;text-align:left;width:100%}
.uc:hover{background:#1b1b1e}
.av{width:30px;height:30px;border-radius:50%;background:#2E2E34;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#E4E4E7}
.un{font-size:11.5px;font-weight:500}.ur{font-size:9.5px;color:#8A8A93;margin-top:2px}
main{flex:1;min-width:0;padding:26px 30px;display:flex;flex-direction:column;gap:18px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-1px;color:#A78BFA}
.sub{font-size:12px;color:#8A8A93;margin-top:4px}
.ha{display:flex;gap:10px;align-items:center}
.search{width:230px;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#151517;border:1px solid #26262A;border-radius:10px;transition:.15s}
.search:focus-within{border-color:#6C4BE8;width:280px}
.search .ic{width:14px;height:14px;color:#8A8A93}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:11.5px}
.search input::placeholder{color:#8A8A93}
.btn{height:38px;display:flex;align-items:center;gap:6px;padding:0 14px;background:#6C4BE8;color:#fff;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap;transition:.15s}
.btn .ic{width:14px;height:14px}
.btn:hover{background:#7a5bf0;box-shadow:0 6px 20px -6px #6C4BE8}.btn:active{transform:scale(.97)}
.btn.o{background:transparent;outline:1px solid #26262A;outline-offset:-.5px;color:#E4E4E7;font-weight:500}
.btn.o:hover{background:#1b1b1e;outline-color:#6C4BE8;box-shadow:none}
.btn.s{height:auto;padding:8px 10px;border-radius:8px;font-size:10.5px;font-weight:600}
.btn.s.o{font-weight:500}
.btn.g{background:#0D2A1C;color:#4ADE80;pointer-events:none}
.body{display:flex;gap:16px;align-items:flex-start}
.tbl{flex:1;min-width:0;background:#151517;border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}.inner{min-width:640px}
.r{display:flex;align-items:center;padding:0 16px}
.th{padding:15px 16px 11px}
.th button,.th span{font-size:10px;font-weight:500;color:#8A8A93;white-space:nowrap;display:flex;align-items:center;gap:4px;transition:color .15s}
.th button:hover{color:#E4E4E7}.th button.on{color:#C4B5FD}
.c1{flex:1;min-width:0}.c2{width:96px}.c3{width:176px}.c4{width:140px}.c5{width:104px}
.c2,.c3,.c4,.c5{flex-shrink:0;display:flex}
.row{height:46px;border-top:1px solid #1F1F23;cursor:pointer;transition:background .15s;width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row:hover{background:#1b1b1e}.row.sel{background:#211C30}
.emp{display:flex;align-items:center;gap:10px}
.ea{width:28px;height:28px;border-radius:50%;background:#2B2145;color:#C4B5FD;display:grid;place-items:center;font-size:9px;font-weight:600;flex-shrink:0}
.ea.n{background:#26262A;color:#D4D4D8}
.cn{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc{font-size:10px;color:#8A8A93;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font-size:12.5px;font-weight:500;white-space:nowrap}.vm{font-size:11.5px;color:#8A8A93;white-space:nowrap}
.bd{padding:3px 8px;border-radius:999px;font-size:9px;font-weight:600;white-space:nowrap}
.w{background:rgba(251,191,36,.12);color:#FBBF24}.d{background:rgba(248,113,113,.12);color:#F87171}.k{background:rgba(74,222,128,.12);color:#4ADE80}.n{background:#26262A;color:#D4D4D8}
.empty{padding:34px 16px;text-align:center;font-size:12px;color:#8A8A93}
.det{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:20px}
.card{background:#151517;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card.t{gap:12px}.card.nt{gap:10px}
.ch{display:flex;align-items:center;gap:12px}
.da{width:44px;height:44px;border-radius:50%;background:#2B2145;color:#C4B5FD;display:grid;place-items:center;font-size:13px;font-weight:700}
.da.n{background:#26262A;color:#D4D4D8}
.dn{font-size:14px;font-weight:700}.dm{font-size:10.5px;color:#8A8A93;margin-top:3px}
.dv{height:1px;background:#26262A}
.lb{font-size:9.5px;color:#8A8A93;margin-bottom:4px}.cname{font-size:11.5px;font-weight:500;color:#E4E4E7;margin-bottom:4px}.ci{font-size:10px;line-height:14px;color:#8A8A93;word-break:break-word}
.ac{display:flex;gap:8px;flex-wrap:wrap}
.ct{font-size:14px;font-weight:700}
.pl{display:flex;flex-direction:column;gap:8px}
.pi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:#1E1E21;border-radius:9px;transition:background .15s}
.pi:hover{background:#26262a}
.pn{font-size:11px;font-weight:500}.ps{font-size:9.5px;color:#8A8A93;margin-top:2px}.pp{font-size:12.5px;font-weight:700}
.note{font-size:10.5px;line-height:17px;color:#8A8A93}
.note small{display:block;font-size:9px;color:#5f5f68;margin-top:1px}
.nf{height:46px;display:flex;align-items:center;padding:0 12px;background:#0E0E10;outline:1px solid #26262A;outline-offset:-.5px;border-radius:9px;transition:.15s}
.nf:focus-within{outline-color:#6C4BE8}
.nf input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:10px}
.nf input::placeholder{color:#8A8A93}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50;padding:20px}
.ov.open{display:grid}
.modal{width:100%;max-width:420px;background:#151517;border:1px solid #26262A;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modal h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.4px}
.f{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:500;color:#8A8A93}
.f input{height:38px;padding:0 12px;border-radius:9px;background:#0E0E10;border:0;outline:1px solid #26262A;outline-offset:-.5px;font-size:12px;color:#F4F4F5;transition:.15s}
.f input:focus{outline-color:#6C4BE8}.f input.err{outline-color:#F87171}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#151517;border:1px solid #6C4BE8;font-size:12px;font-weight:500;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.body{flex-direction:column}.det{width:100%;position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start}.tbl{width:100%;flex:none}}
@media(max-width:760px){.side{display:none}main{padding:20px 16px}.search,.search:focus-within{width:100%}.ha{width:100%}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-dash" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
<symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
<symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</defs></svg>

<div class="app">
<aside class="side">
  <div class="logo"><div class="mk">D!</div><div><div class="bn">Deu Bug!</div><div class="bl">ADMIN</div></div></div>
  <nav>
    <a class="nav" href="admin-visao-geral.html"><svg class="ic"><use href="#i-dash"/></svg><span>Visão geral</span></a>
    <a class="nav" href="admin-projetos.html"><svg class="ic"><use href="#i-folder"/></svg><span>Projetos</span></a>
    <a class="nav on" href="admin-clientes.html"><svg class="ic"><use href="#i-users"/></svg><span>Clientes</span></a>
    <a class="nav" href="admin-solicitacoes.html"><svg class="ic"><use href="#i-msg"/></svg><span>Solicitações</span><i class="bdg">8</i></a>
    <a class="nav" href="#" data-t="Financeiro: em breve"><svg class="ic"><use href="#i-wallet"/></svg><span>Financeiro</span></a>
  </nav>
  <div class="sp"></div>
  <div class="sf">
    <a class="vc" href="#" data-t="Abrindo visão do cliente…"><svg class="ic"><use href="#i-eye"/></svg>Ver como cliente</a>
    <button class="uc"><div class="av">RL</div><div><div class="un">Rafael Lima</div><div class="ur">Gestor de projetos</div></div></button>
  </div>
</aside>

<main>
  <div class="hd">
    <div><h1>Clientes</h1><div class="sub" id="sub"></div></div>
    <div class="ha">
      <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q" placeholder="Buscar cliente" autocomplete="off" /></label>
      <button class="btn" id="novo"><svg class="ic"><use href="#i-plus"/></svg>Novo cliente</button>
    </div>
  </div>

  <div class="body">
    <div class="tbl"><div class="scroll"><div class="inner">
      <div class="r th">
        <div class="c1"><button data-s="name">Empresa<span id="a-name"></span></button></div>
        <div class="c2"><button data-s="ativos">Projetos ativos<span id="a-ativos"></span></button></div>
        <div class="c3"><button data-s="status">Situação<span id="a-status"></span></button></div>
        <div class="c4"><button data-s="total">Total contratado<span id="a-total"></span></button></div>
        <div class="c5"><button data-s="dias">Último acesso<span id="a-dias"></span></button></div>
      </div>
      <div id="rows"></div>
      <div style="height:10px"></div>
    </div></div></div>

    <div class="det" id="det"></div>
  </div>
</main>
</div>

<div class="ov" id="ov">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>Novo cliente</h2>
    <label class="f">Empresa<input id="m-n" placeholder="Ex.: Padaria Doce Trigo" /></label>
    <label class="f">Contato principal<input id="m-c" placeholder="Ex.: Marina Rocha" /></label>
    <div class="row2"><label class="f">E-mail<input id="m-e" type="email" placeholder="contato@empresa.com" /></label><label class="f">Telefone<input id="m-t" placeholder="(11) 90000-0000" /></label></div>
    <div class="acts"><button class="btn o" id="m-x">Cancelar</button><button class="btn" id="m-ok">Criar cliente</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)};
const DET='admin-projeto-detalhe.html';
const ST={warn:['w'],risk:['d'],ok:['k'],done:['n'],new:['n']};
let id=0;
const C=(name,ini,contact,email,phone,since,status,sl,total,acc,dias,projs,notes)=>({id:++id,name,ini,contact,email,phone,since,status,sl,total,acc,dias,projs,notes,invited:false});
let data=[
 C('Padaria Doce Trigo','DT','Marina Rocha','marina@docetrigo.com.br','(11) 91111-2222','Cliente deste set 2026','warn','Aprovação pendente',5000,'Hoje',0,[['Loja online Doce Trigo','Desenvolvimento',62],['Site Doce Trigo','Revisão',88],['Promoção de Natal','Design',22]],['Prefere conversar por WhatsApp. Responde melhor à noite. Já perguntou sobre pagamento por boleto.']),
 C('Studio Aurora Pilates','AP','Camila Duarte','camila@studioaurora.com.br','(11) 92222-3333','Cliente deste ago 2026','risk','Em risco',4200,'Há 6 dias',6,[['Landing Aurora Pilates','Briefing',15],['Agendamento de aulas','Desenvolvimento',70]],['Fotos pendentes há 6 dias. Vale ligar antes de cobrar de novo.']),
 C('Clínica Vida Plena','VP','Dra. Helena Prado','helena@vidaplena.com.br','(11) 93333-4444','Cliente deste jun 2026','ok','Em dia',7800,'Ontem',1,[['Site Clínica Vida Plena','Design',35],['Área de exames online','Revisão',92]],['Prazo do site vence em breve. Aprovação costuma ser rápida.']),
 C('Café Girassol','CG','Tiago Mendes','tiago@cafegirassol.com.br','(11) 94444-5555','Cliente deste jul 2026','risk','Fatura em atraso',3900,'Hoje',0,[['Identidade para o cardápio digital','Design',40],['Loja Café Girassol','Desenvolvimento',48]],['Pediu segunda via do boleto. Avisar o financeiro.']),
 C('Móveis Pereira','MP','Sérgio Pereira','sergio@moveispereira.com.br','(11) 95555-6666','Cliente deste mai 2026','ok','Em dia',6100,'Há 3 dias',3,[['Catálogo online','Briefing',8],['Site institucional','Revisão',95]],['Teve problema de acesso ao portal. Resolvido.']),
 C('Escola Pequeno Mundo','PM','Renata Alves','renata@pequenomundo.com.br','(11) 96666-7777','Cliente deste abr 2026','ok','Em dia',4600,'Há 1 semana',7,[['Site institucional','Briefing',5]],[]),
 C('Mecânica Irmãos Souza','IS','Paulo Souza','paulo@irmaossouza.com.br','(11) 97777-8888','Cliente deste mar 2026','done','Concluído',2800,'Ontem',1,[],['Site publicado em 18 out. Possível cliente para manutenção mensal.']),
];
let sel=1,sort={k:null,dir:1},q='';
const money=n=>'R$ '+n.toLocaleString('pt-BR');
function list(){
  let l=data.filter(c=>(c.name+' '+c.contact).toLowerCase().includes(q));
  if(sort.k){const g={name:c=>c.name,ativos:c=>c.projs.length,status:c=>c.sl,total:c=>c.total,dias:c=>c.dias}[sort.k];
    l=[...l].sort((a,b)=>{const x=g(a),y=g(b);return (typeof x==='string'?x.localeCompare(y,'pt-BR'):x-y)*sort.dir})}
  return l;
}
function renderRows(){
  const l=list(),all=data;
  $('#sub').textContent=`${l.length} ${l.length===1?'empresa':'empresas'} · ${l.filter(c=>c.projs.length).length} com projeto em andamento`;
  $('#rows').innerHTML=l.map(c=>`<button class="r row ${c.id===sel?'sel':''}" data-id="${c.id}">
    <div class="c1 emp"><div class="ea ${c.status==='done'||c.status==='new'?'n':''}">${c.ini}</div><div style="min-width:0"><div class="cn">${esc(c.name)}</div><div class="cc">${esc(c.contact)}</div></div></div>
    <div class="c2 v">${c.projs.length}</div><div class="c3"><span class="bd ${ST[c.status][0]}">${c.sl}</span></div>
    <div class="c4 v">${money(c.total)}</div><div class="c5 vm">${c.acc}</div></button>`).join('')||'<div class="empty">Nenhum cliente encontrado</div>';
  ['name','ativos','status','total','dias'].forEach(k=>{const a=$('#a-'+k);a.innerHTML=sort.k===k?`<svg class="ic" style="width:10px;height:10px"><use href="#i-${sort.dir>0?'up':'down'}"/></svg>`:'';a.parentElement.classList.toggle('on',sort.k===k)});
}
function renderDet(){
  const c=data.find(x=>x.id===sel);
  if(!c){$('#det').innerHTML='<div class="card"><div class="note">Selecione um cliente para ver os detalhes.</div></div>';return}
  const n=c.status==='done'||c.status==='new'?'n':'';
  $('#det').innerHTML=`
  <div class="card"><div class="ch"><div class="da ${n}">${c.ini}</div><div style="flex:1;min-width:0"><div class="dn">${esc(c.name)}</div><div class="dm">${esc(c.since)}</div></div></div>
    <div class="dv"></div>
    <div><div class="lb">Contato principal</div><div class="cname">${esc(c.contact)}</div><div class="ci">${esc(c.email)}${c.phone?' · '+esc(c.phone):''}</div></div>
    <div class="ac"><button class="btn s" id="msg">Enviar mensagem</button><button class="btn s o ${c.invited?'g':''}" id="inv">${c.invited?'Convite enviado ✓':'Reenviar convite'}</button></div></div>
  <div class="card t"><div class="ct">Projetos</div><div class="pl">${c.projs.map(p=>`<a class="pi" href="${DET}"><div><div class="pn">${esc(p[0])}</div><div class="ps">${p[1]}</div></div><div class="pp">${p[2]}%</div></a>`).join('')||'<div class="note">Nenhum projeto ativo.</div>'}</div></div>
  <div class="card nt"><div class="ct">Notas internas</div>
    ${c.notes.map(t=>`<div class="note">${esc(t)}</div>`).join('')||'<div class="note">Sem notas internas ainda.</div>'}
    <label class="nf"><input id="nota" placeholder="Adicionar nota interna" autocomplete="off" /></label></div>`;
}
const all=()=>{renderRows();renderDet()};
$('#rows').addEventListener('click',e=>{const b=e.target.closest('.row');if(b){sel=+b.dataset.id;all()}});
document.querySelector('.th').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;
  if(sort.k===b.dataset.s){if(sort.dir>0)sort.dir=-1;else sort={k:null,dir:1}}else sort={k:b.dataset.s,dir:1};renderRows()});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();renderRows();const l=list();if(l.length&&!l.some(c=>c.id===sel)){sel=l[0].id;renderDet()}});
$('#det').addEventListener('click',e=>{const c=data.find(x=>x.id===sel);
  if(e.target.id==='msg')toast('Abrindo conversa com '+c.contact.split(' ')[0]+'…');
  if(e.target.id==='inv'&&!c.invited){c.invited=true;toast('Convite reenviado para '+c.email);renderDet()}});
$('#det').addEventListener('keydown',e=>{if(e.target.id==='nota'&&e.key==='Enter'){const v=e.target.value.trim();if(!v)return;
  data.find(x=>x.id===sel).notes.push(v);toast('Nota adicionada');renderDet();$('#nota').focus()}});
/* modal */
const ov=$('#ov'),close=()=>ov.classList.remove('open');
$('#novo').addEventListener('click',()=>{['m-n','m-c','m-e','m-t'].forEach(i=>{$('#'+i).value='';$('#'+i).classList.remove('err')});ov.classList.add('open');$('#m-n').focus()});
$('#m-x').addEventListener('click',close);
ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&ov.classList.contains('open')&&e.target.tagName==='INPUT')$('#m-ok').click()});
$('#m-ok').addEventListener('click',()=>{
  const n=$('#m-n'),c=$('#m-c');let bad=false;[n,c].forEach(i=>{const b=!i.value.trim();i.classList.toggle('err',b);bad=bad||b});
  if(bad){toast('Preencha empresa e contato');return}
  const w=n.value.trim().split(/\s+/),ini=(w[0][0]+(w[1]?w[1][0]:w[0][1]||'')).toUpperCase(),d=new Date();
  const mes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][d.getMonth()];
  data.push(C(n.value.trim(),ini,c.value.trim(),$('#m-e').value.trim()||'—',$('#m-t').value.trim(),`Cliente deste ${mes} ${d.getFullYear()}`,'new','Novo',0,'Nunca',99,[],[]));
  sel=data[data.length-1].id;q='';$('#q').value='';close();all();toast('Cliente criado');
});
document.addEventListener('click',e=>{const a=e.target.closest('[data-t]');if(a){e.preventDefault();toast(a.dataset.t)}});
all();
</script>
</body>
</html>
