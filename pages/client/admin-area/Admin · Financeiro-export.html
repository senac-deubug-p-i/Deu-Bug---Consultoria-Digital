<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
<style>
*,::before,::after{box-sizing:border-box}
body{margin:0;background:#08080A;color:#F4F4F5;font-family:Inter,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{text-decoration:none;color:inherit}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:flex;min-height:100vh}
.side{width:256px;flex-shrink:0;height:100vh;position:sticky;top:0;background:#0E0E10;border-right:1px solid #26262A;padding:22px 14px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:0 4px;margin-bottom:26px}
.mk{width:34px;height:34px;border-radius:10px;background:#fff;color:#08080A;display:grid;place-items:center;font-size:15px;font-weight:700;letter-spacing:-.6px}
.bn{font-size:14.5px;font-weight:600;letter-spacing:-.2px}.bl{font-size:8px;letter-spacing:1.6px;color:#8A8A93;margin-top:2px}
nav{display:flex;flex-direction:column;gap:4px}
.nav{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:500;color:#8A8A93;transition:background .15s,color .15s}
.nav:hover{background:#151517;color:#F4F4F5}
.nav.on{background:#6C4BE8;color:#fff}
.nav span{flex:1}
.bdg{background:#2A2A2E;color:#D4D4D8;font-size:9px;font-weight:500;padding:2px 6px;border-radius:999px}
.sp{flex:1}
.sf{display:flex;flex-direction:column;gap:10px}
.vc{height:36px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #26262A;border-radius:10px;font-size:11.5px;color:#C8C8CE;transition:.15s}
.vc .ic{width:14px;height:14px;color:#8A8A93}
.vc:hover{background:#151517;border-color:#6C4BE8;color:#fff}
.uc{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#151517;border-radius:12px;transition:.15s;text-align:left;width:100%}
.uc:hover{background:#1b1b1e}
.av{width:30px;height:30px;border-radius:50%;background:#2E2E34;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#E4E4E7}
.un{font-size:11.5px;font-weight:500}.ur{font-size:9.5px;color:#8A8A93;margin-top:2px}
main{flex:1;min-width:0;padding:26px 30px;display:flex;flex-direction:column;gap:18px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-1px;color:#A78BFA}
.sub{font-size:12px;color:#8A8A93;margin-top:4px}
.ha{display:flex;gap:10px;align-items:center}
.dd{position:relative}
.dd-b{width:170px;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#151517;border:1px solid #26262A;border-radius:10px;font-size:11.5px;color:#D4D4D8;transition:.15s}
.dd-b .ic{width:14px;height:14px;color:#8A8A93}
.dd-b:hover,.dd.open .dd-b{border-color:#6C4BE8}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:100%;z-index:20;background:#151517;border:1px solid #26262A;border-radius:10px;padding:5px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.dd.open .menu{display:block}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:11.5px;color:#D4D4D8;white-space:nowrap}
.menu button:hover{background:#1E1E21}.menu button.on{background:#211C30;color:#C4B5FD}
.btn{height:38px;display:flex;align-items:center;gap:6px;padding:0 14px;background:#6C4BE8;color:#fff;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap;transition:.15s}
.btn .ic{width:14px;height:14px}
.btn:hover{background:#7a5bf0;box-shadow:0 6px 20px -6px #6C4BE8}.btn:active{transform:scale(.97)}
.btn.o{background:transparent;outline:1px solid #26262A;outline-offset:-.5px;color:#E4E4E7;font-weight:500}
.btn.o:hover{background:#1b1b1e;outline-color:#6C4BE8;box-shadow:none}
.btn.s{height:auto;padding:7px 12px;border-radius:8px;font-size:10px;font-weight:600}.btn.s.o{font-weight:500}
.btn.ok{background:rgba(74,222,128,.12);color:#4ADE80;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.k{display:flex;flex-direction:column;gap:9px;padding:15px 16px;min-height:106px;background:#151517;border-radius:12px;transition:transform .15s,background .15s}
.k:hover{transform:translateY(-2px);background:#18181b}
.k.pr{background:#6C4BE8}.k.pr:hover{background:#7a5bf0;box-shadow:0 10px 26px -10px #6C4BE8}
.k div:first-child{display:flex;flex-direction:column;gap:5px}
.kl{font-size:11px;font-weight:500;color:#8A8A93}.kv{font-size:25px;line-height:28px;font-weight:700}.ks{font-size:9.5px;color:#8A8A93}
.pr .kl{color:#EDE7FF}.pr .ks{color:#EAE2FF}.g{color:#4ADE80!important}.rd{color:#F87171!important}
.row{display:flex;gap:16px;align-items:stretch}
.card{background:#151517;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px}
.ct{font-size:14px;font-weight:700}
.c1{flex:1.4;min-width:0}.c2{flex:1;min-width:0;gap:20px}
.bars{display:flex;gap:12px;align-items:flex-end;height:225px}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;height:100%;cursor:pointer}
.bv{font-size:9.5px;font-weight:500;color:#8A8A93;transition:color .15s}
.bar{width:100%;background:#9B7FE8;border-radius:6px 6px 0 0;transition:background .15s,height .5s cubic-bezier(.2,.8,.2,1)}
.bm{font-size:10px;color:#8A8A93}
.bc:hover .bar{background:#B5A0F5}.bc.on .bar,.bc.on:hover .bar{background:#6C4BE8}
.bc.on .bv,.bc:hover .bv{color:#F4F4F5}
.sv{display:flex;flex-direction:column;gap:17px}
.si{display:flex;flex-direction:column;gap:7px;cursor:default}
.sh{display:flex;justify-content:space-between;font-size:10.5px;font-weight:500}.sh span:first-child{color:#D4D4D8}
.trk{height:6px;border-radius:999px;background:#242428;overflow:hidden}
.fl{height:100%;width:0;border-radius:999px;background:#A78BFA;transition:width .7s cubic-bezier(.2,.8,.2,1),background .15s}
.si:hover .fl{background:#C4B0FF}
.fat{background:#151517;border-radius:14px;overflow:hidden}
.fh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 14px;gap:12px;flex-wrap:wrap}
.fh .ct{font-size:15px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:999px;background:#1E1E21;outline:1px solid #26262A;outline-offset:-.5px;font-size:10.5px;font-weight:500;color:#D4D4D8;transition:.15s}
.pill:hover{background:#26262a}
.pill.on{background:#6C4BE8;color:#fff;font-weight:600;outline:0}
.scroll{overflow-x:auto}.inner{min-width:900px}
.r{display:flex;align-items:center;padding:0 20px}
.th{padding-bottom:10px;font-size:10px;font-weight:500;color:#8A8A93}
.tr{height:56px;border-top:1px solid #1F1F23;cursor:pointer;transition:background .15s;width:100%;text-align:left}
.tr:hover{background:#1b1b1e}
.f1{flex:1;min-width:0}.f2{width:215px}.f3{width:100px}.f4{width:90px}.f5{width:90px}.f6{width:180px}.f7{width:150px;justify-content:flex-end;display:flex}
.f2,.f3,.f4,.f5,.f6,.f7{flex-shrink:0}
.cl{font-size:11.5px;font-weight:600}.pj{font-size:10.5px;color:#C9C9CF}.pa{font-size:10.5px;color:#A1A1AA}.vn{font-size:10.5px;color:#8A8A93}.vl{font-size:11px;font-weight:500;color:#E4E4E7}
.bd{padding:3px 8px;border-radius:999px;font-size:9px;font-weight:600;white-space:nowrap}
.d{background:rgba(248,113,113,.12);color:#F87171}.w{background:rgba(251,191,36,.12);color:#FBBF24}.n{background:#26262A;color:#D4D4D8}.k2{background:rgba(74,222,128,.12);color:#4ADE80}
.empty{padding:34px 20px;text-align:center;font-size:12px;color:#8A8A93;border-top:1px solid #1F1F23}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50;padding:20px}
.ov.open{display:grid}
.modal{width:100%;max-width:420px;background:#151517;border:1px solid #26262A;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modal h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.4px}
.f{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:500;color:#8A8A93}
.f input,.f select{height:38px;padding:0 12px;border-radius:9px;background:#0E0E10;border:0;outline:1px solid #26262A;outline-offset:-.5px;font-size:12px;color:#F4F4F5;transition:.15s;color-scheme:dark}
.f input:focus,.f select:focus{outline-color:#6C4BE8}.f input.err{outline-color:#F87171}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;flex-wrap:wrap}
.bx{background:#0E0E10;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bx div{display:flex;justify-content:space-between;font-size:11.5px;color:#8A8A93}.bx b{color:#F4F4F5;font-weight:600}
.code{font-size:10.5px;letter-spacing:.3px;color:#C4B5FD;word-break:break-all;background:#0E0E10;border-radius:9px;padding:10px 12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#151517;border:1px solid #6C4BE8;font-size:12px;font-weight:500;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.row{flex-direction:column}}
@media(max-width:760px){.side{display:none}main{padding:20px 16px}.kpis{grid-template-columns:1fr}.ha{width:100%}.dd{flex:1}.dd-b{width:100%}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-dash" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
<symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>

</defs></svg>

<div class="app">
<aside class="side">
  <div class="logo"><div class="mk">D!</div><div><div class="bn">Deu Bug!</div><div class="bl">ADMIN</div></div></div>
  <nav>
    <a class="nav" href="admin-visao-geral.html"><svg class="ic"><use href="#i-dash"/></svg><span>Visão geral</span></a>

  </nav>
  <div class="sp"></div>

    <a class="vc" href="#" data-t="Abrindo visão do cliente…"><svg class="ic"><use href="#i-eye"/></svg>Ver como cliente</a>
    <button class="uc"><div class="av">RL</div><div><div class="un">Rafael Lima</div><div class="ur">Gestor de projetos</div></div></button>
  </div>

<main>
  <div class="hd">
    <div><h1>Financeiro</h1><div class="sub">Cobranças, recebimentos e inadimplência.</div></div>
    <div class="ha">
      <div class="dd" id="dd"><button class="dd-b" id="ddb"><svg class="ic"><use href="#i-cal"/></svg><span id="ddl">Outubro de 2026</span></button><div class="menu" id="menu"></div></div>
      <button class="btn" id="emitir"><svg class="ic" style="width:14px;height:14px"><use href="#i-zap"/></svg>Emitir cobrança</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

    <div class="card c1"><div class="ct">Receita dos últimos 6 meses</div><div class="bars" id="bars"></div></div>
    <div class="card c2"><div class="ct">Receita por serviço</div><div class="sv" id="sv"></div></div>
  </div>

  <div class="fat">
    <div class="fh"><div class="ct">Faturas</div><div class="pills" id="pills"></div></div>
    <div class="scroll"><div class="inner">
      <div class="r th"><div class="f1">Cliente</div><div class="f2">Projeto</div><div class="f3">Parcela</div><div class="f4">Vencimento</div><div class="f5">Valor</div><div class="f6">Situação</div><div class="f7"></div></div>
      <div id="rows"></div><div style="height:12px"></div>
    </div></div>

</main>

<div class="ov" id="ov-e"><div class="modal" role="dialog" aria-modal="true">
  <h2>Emitir cobrança</h2>
  <label class="f">Cliente<select id="e-c"></select></label>
  <label class="f">Projeto<input id="e-p" placeholder="Ex.: Loja online Doce Trigo" /></label>
  <div class="r2"><label class="f">Valor (R$)<input id="e-v" type="number" min="1" step="0.01" placeholder="1500" /></label><label class="f">Vencimento<input id="e-d" type="date" /></label></div>
  <label class="f">Parcela<input id="e-n" placeholder="1 de 1" /></label>
  <div class="acts"><button class="btn o" data-x>Cancelar</button><button class="btn" id="e-ok">Emitir cobrança</button></div>
</div></div>

<div class="ov" id="ov-b"><div class="modal" role="dialog" aria-modal="true">
  <h2>Boleto</h2><div class="bx" id="b-info"></div><div class="code" id="b-code"></div>
  <div class="acts"><button class="btn o" data-x>Fechar</button><button class="btn o" id="b-copy">Copiar linha digitável</button><button class="btn" id="b-pay">Marcar como paga</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)};
const brl=n=>'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const TODAY=new Date(2026,9,19); // data do design: segunda, 19 de outubro
const dstr=d=>String(d.getDate()).padStart(2,'0')+' '+MES[d.getMonth()];
const diff=d=>Math.round((d-TODAY)/864e5);
/* dados */
const M=[['mai','Maio',16200],['jun','Junho',19800],['jul','Julho',17600],['ago','Agosto',21300],['set','Setembro',23100],['out','Outubro',18400]];
const SV=[['Lojas virtuais',8600],['Sites institucionais',6200],['Landing pages',2400],['Manutenção mensal',1200]];
const CL=['Padaria Doce Trigo','Studio Aurora Pilates','Clínica Vida Plena','Café Girassol','Móveis Pereira','Escola Pequeno Mundo','Mecânica Irmãos Souza'];
let id=0;
const F=(c,p,n,v,val,t,l)=>({id:++id,c,p,n,v,val,t,l,sent:false});
let inv=[F('Café Girassol','Loja Café Girassol','2 de 3','05 out',1480,'atraso','14 dias de atraso'),F('Studio Aurora Pilates','Agendamento de aulas','1 de 2','10 out',1000,'atraso','9 dias de atraso'),
 F('Padaria Doce Trigo','Loja online Doce Trigo','3 de 4','25 out',1250,'vence','Vence em 6 dias'),F('Clínica Vida Plena','Site Clínica Vida Plena','2 de 3','28 out',2600,'avencer','A vencer'),
 F('Mecânica Irmãos Souza','Site Mecânica Irmãos Souza','3 de 3','15 out',900,'paga','Paga em 15 out'),F('Móveis Pereira','Site institucional','2 de 3','12 out',1800,'paga','Paga em 12 out')];
const X={receber:0,parc:0,out:0,a26:0};
let per=5,tab='todas',cur=null;
/* KPIs */
function kpis(){
  const m=M[per],v=m[2]+(per===5?X.out:0),at=inv.filter(i=>i.t==='atraso'),sum=at.reduce((s,i)=>s+i.val,0);
  const cls=new Set(at.map(i=>i.c)).size;
  $('#kpis').innerHTML=`
  <div class="k pr"><div><div class="kl">Recebido em ${m[1].toLowerCase()}</div><div class="kv">${brl(v)}</div></div><div class="ks">${Math.round(v/25000*100)}% da meta de R$ 25.000</div></div>
  <div class="k"><div><div class="kl">A receber</div><div class="kv">${brl(11250+X.receber)}</div></div><div class="ks">${9+X.parc} parcelas nos próximos 30 dias</div></div>
  <div class="k"><div><div class="kl">Em atraso</div><div class="kv rd">${brl(sum)}</div></div><div class="ks">${at.length} ${at.length===1?'fatura':'faturas'} · ${cls} ${cls===1?'cliente':'clientes'}</div></div>
  <div class="k"><div><div class="kl">Recebido em 2026</div><div class="kv">${brl(142900+X.a26)}</div></div><div class="ks g">+18% sobre 2025</div></div>`;
}
/* gráficos */
function bars(){
  const vals=M.map((m,i)=>m[2]+(i===5?X.out:0));
  $('#bars').innerHTML=M.map((m,i)=>`<div class="bc ${i===per?'on':''}" data-i="${i}" title="${m[1]}: ${brl(vals[i])}"><div class="bv">${(vals[i]/1000).toFixed(1).replace('.',',')}k</div><div class="bar" style="height:${Math.round(vals[i]*7.78/100)}px"></div><div class="bm">${m[0]}</div></div>`).join('');
}
$('#bars').addEventListener('click',e=>{const b=e.target.closest('.bc');if(b){per=+b.dataset.i;sync()}});
$('#sv').innerHTML=SV.map(s=>`<div class="si" title="${Math.round(s[1]/SV.reduce((a,b)=>a+b[1],0)*100)}% da receita"><div class="sh"><span>${s[0]}</span><span>${brl(s[1])}</span></div><div class="trk"><div class="fl" data-w="${Math.round(s[1]/12900*100)}"></div></div></div>`).join('');
$('#menu').innerHTML=M.map((m,i)=>`<button data-i="${i}">${m[1]} de 2026</button>`).join('');
$('#ddb').addEventListener('click',e=>{e.stopPropagation();$('#dd').classList.toggle('open')});
$('#menu').addEventListener('click',e=>{const b=e.target.closest('button');if(b){per=+b.dataset.i;$('#dd').classList.remove('open');sync()}});
document.addEventListener('click',()=>$('#dd').classList.remove('open'));
/* faturas */
const BD={atraso:'d',vence:'w',avencer:'n',paga:'k2'};
const FL={todas:()=>1,atraso:i=>i.t==='atraso',avencer:i=>i.t==='vence'||i.t==='avencer',pagas:i=>i.t==='paga'};
function pills(){$('#pills').innerHTML=[['todas','Todas'],['atraso','Em atraso'],['avencer','A vencer'],['pagas','Pagas']].map(([k,l])=>`<button class="pill ${tab===k?'on':''}" data-k="${k}">${l}</button>`).join('')}
$('#pills').addEventListener('click',e=>{const b=e.target.closest('.pill');if(b){tab=b.dataset.k;pills();rows()}});
function rows(){
  const l=inv.filter(FL[tab]);
  $('#rows').innerHTML=l.map(i=>`<div class="r tr" data-id="${i.id}"><div class="f1 cl">${esc(i.c)}</div><div class="f2 pj">${esc(i.p)}</div><div class="f3 pa">${esc(i.n)}</div><div class="f4 vn">${i.v}</div><div class="f5 vl">${brl(i.val)}</div><div class="f6"><span class="bd ${BD[i.t]}">${i.l}</span></div>
  <div class="f7">${i.t==='atraso'?`<button class="btn s ${i.sent?'ok':''}" data-a="lem">${i.sent?'Lembrete enviado ✓':'Enviar lembrete'}</button>`:i.t==='paga'?'<button class="btn s o" data-a="rec">Recibo</button>':'<button class="btn s o" data-a="bol">Ver boleto</button>'}</div></div>`).join('')||'<div class="empty">Nenhuma fatura nesta categoria.</div>';
}
$('#rows').addEventListener('click',e=>{
  const r=e.target.closest('.tr');if(!r)return;const i=inv.find(x=>x.id===+r.dataset.id),a=e.target.closest('[data-a]')?.dataset.a;
  if(a==='lem'){if(!i.sent){i.sent=true;toast('Lembrete enviado para '+i.c);rows()}return}
  if(i.t==='paga'){toast('Baixando recibo de '+i.c+'…');return}
  openBoleto(i);
});
/* boleto */
const ovb=$('#ov-b');
function openBoleto(i){cur=i;
  $('#b-info').innerHTML=`<div><span>Cliente</span><b>${esc(i.c)}</b></div><div><span>Projeto</span><b>${esc(i.p)}</b></div><div><span>Parcela</span><b>${esc(i.n)}</b></div><div><span>Vencimento</span><b>${i.v}</b></div><div><span>Valor</span><b>${brl(i.val)}</b></div>`;
  $('#b-code').textContent=`23793.38128 60${String(i.id).padStart(3,'0')}0.000003 00000.000400 1 ${String(Math.round(i.val*100)).padStart(14,'0')}`;
  ovb.classList.add('open');
}
$('#b-copy').addEventListener('click',()=>{navigator.clipboard?.writeText($('#b-code').textContent);toast('Linha digitável copiada')});
$('#b-pay').addEventListener('click',()=>{
  if(!cur)return;
  if(cur.t==='vence'||cur.t==='avencer'){X.receber-=cur.val;X.parc-=1}
  X.out+=cur.val;X.a26+=cur.val;
  cur.t='paga';cur.l='Paga em '+dstr(TODAY);cur.v=dstr(TODAY);
  toast('Fatura de '+cur.c+' marcada como paga');ovb.classList.remove('open');sync();
});
/* emitir */
const ove=$('#ov-e');
$('#e-c').innerHTML=CL.map(c=>`<option>${c}</option>`).join('');
$('#emitir').addEventListener('click',()=>{
  ['e-p','e-v','e-n'].forEach(k=>{$('#'+k).value='';$('#'+k).classList.remove('err')});
  const d=new Date(TODAY);d.setDate(d.getDate()+7);$('#e-d').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  $('#e-n').value='1 de 1';ove.classList.add('open');$('#e-p').focus();
});
$('#e-ok').addEventListener('click',()=>{
  const p=$('#e-p'),v=$('#e-v');let bad=false;
  [[p,!p.value.trim()],[v,!(parseFloat(v.value)>0)]].forEach(([el,b])=>{el.classList.toggle('err',b);bad=bad||b});
  if(bad){toast('Preencha projeto e valor');return}
  const [y,m,dd]=$('#e-d').value.split('-').map(Number),d=new Date(y,m-1,dd),n=diff(d),val=parseFloat(v.value);
  let t,l;
  if(n<0){t='atraso';l=`${-n} ${-n===1?'dia':'dias'} de atraso`}else if(n===0){t='vence';l='Vence hoje'}else if(n<=7){t='vence';l=`Vence em ${n} ${n===1?'dia':'dias'}`}else{t='avencer';l='A vencer'}
  if(t!=='atraso'){X.receber+=val;X.parc+=1}
  inv.unshift(F($('#e-c').value,p.value.trim(),$('#e-n').value.trim()||'1 de 1',dstr(d),val,t,l));
  tab='todas';ove.classList.remove('open');sync();toast('Cobrança emitida para '+$('#e-c').value);
});
/* overlays */
document.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>document.querySelectorAll('.ov').forEach(o=>o.classList.remove('open'))));
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('mousedown',e=>{if(e.target===o)o.classList.remove('open')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.ov').forEach(o=>o.classList.remove('open'));if(e.key==='Enter'&&ove.classList.contains('open')&&e.target.tagName==='INPUT')$('#e-ok').click()});
document.addEventListener('click',e=>{const a=e.target.closest('[data-t]');if(a){e.preventDefault();toast(a.dataset.t)}});
function sync(){$('#ddl').textContent=M[per][1]+' de 2026';document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('on',+b.dataset.i===per));kpis();bars();pills();rows()}
sync();
requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.fl').forEach(f=>f.style.width=f.dataset.w+'%'),50));
</script>
</body>
</html>
