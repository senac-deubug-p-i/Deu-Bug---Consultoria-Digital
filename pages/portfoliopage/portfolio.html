<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="portfolio.output.css">
  <link rel="shortcut icon" href="../../assets/images/DeuBug_favIcon.ico" type="image/x-icon">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jersey+10&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Tiny5&display=swap"
    rel="stylesheet">
  <title>Portfólio</title>
</head>

<body class="bg-[#08070C]">

  <!-- Filtro LiquidGlass -->
  <svg style="display:none">
    <filter id="liquid-distortion" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.009" numOctaves="2" seed="6" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <section class="flex flex-col w-full">

    <header class="fixed z-999 flex w-full justify-center gap-5 mt-[34px]">

      <nav class="liquid-glass relative flex w-[1474px] max-w-full h-[50px]
                  items-center justify-between rounded-full px-[55px]">
        <div class="flex gap-[23px] min-w-[240px]">
          <a href="" class="text-[15px] font-nunito text-roxo">PROJETOS</a>
          <a href="" class="text-[15px] font-nunito text-roxo">PACOTES</a>
          <a href="" class="text-[15px] font-nunito text-roxo">SOBRE</a>
        </div>
        <img src="../../assets/images/ReducedLogo_DeuBug.png" alt="Deu_Bug Logo" class="h-10">
        <div class="flex min-w-[240px]"></div>
      </nav>

      <button class="liquid-glass relative flex items-center justify-center w-[100px] h-[50px]
                     rounded-full cursor-pointer text-[16px] font-nunito font-extrabold text-roxo
                     transition-all duration-1000 hover:border-white/50 hover:text-[#b987f1]">
        Login
      </button>

      <button class="liquid-glass relative flex items-center justify-center w-[100px] h-[50px]
                     rounded-full cursor-pointer text-[16px] font-nunito font-extrabold text-roxo
                     transition-all duration-1000 hover:border-white/50 hover:text-[#b987f1]">
        temporario
      </button>
    </header>

    <!-- Intro -->
    <div class="flex flex-row w-full h-[900px] px-[164px]
                bg-[url('../../assets/videos/laptop-animation-gif.gif')] bg-no-repeat bg-cover">

      <div class="mt-[150px]">
        <div class="absolute flex flex-col">
          <h2 class="h-[155px] text-[128px] font-inter font-black text-roxo cursor-default">EXPLORE</h2>
          <h2
            class="h-[155px] ml-[120px] text-[128px] font-inter font-black text-roxo cursor-default animate-switch-font">
            NOSSAS</h2>
          <h2 class="h-[155px] ml-[339px] text-[128px] font-inter font-black text-roxo cursor-default
                     hover:text-[148px] hover:font-tiny5 hover:font-normal hover:cursor-pointer">CRIAÇÕES</h2>
        </div>
      </div>

      <!-- Botão de scroll -->
      <div class="mt-[150px] flex w-full items-center justify-center">
        <div class="relative flex items-center justify-center self-end
                    w-[30px] h-[50px] mb-4 cursor-pointer
                    border-3 border-roxo rounded-full
                    before:content-[''] before:absolute before:bottom-[30px] before:left-1/2
                    before:-ml-[3px] before:w-1.5 before:h-1.5 before:rounded-full
                    before:bg-roxo-claro before:animate-scrolldown
                    before:shadow-[0_-5px_3px_1px_#7b4bb366]">
          <div class="flex flex-col items-center w-[30px] pt-1.5 -ml-[3px] mt-12">
            <div
              class="relative inline-block w-2.5 h-2.5 -mt-1.5 rotate-45 border-roxo border-r-3 border-b-3 animate-chevron">
            </div>
            <div
              class="relative inline-block w-2.5 h-2.5 -mt-1.5 rotate-45 border-roxo border-r-3 border-b-3 animate-chevron-delay">
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

    


</body>

</html>
